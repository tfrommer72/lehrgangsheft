# /etc/nginx/sites-available/lehrgangsheft
# HTTPS übernimmt der Nginx Proxy Manager (CT 102). Dieser Server lauscht nur intern auf Port 80.
# default_server ist wichtig: Chromium ruft für den PDF-Export http://127.0.0.1 auf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/lehrgangsheft/public;
    index index.php;

    client_max_body_size 1m;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 120s;   # PDF-Erzeugung kann beim ersten Abruf einige Sekunden dauern
    }

    # Alles außer public/ ist ohnehin nicht erreichbar; sicherheitshalber:
    location ~ /\. { deny all; }
}
